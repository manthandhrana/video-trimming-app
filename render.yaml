services:
  - type: web
    name: video-cutting-app
    env: node
    plan: free
    buildCommand: |
      apt-get update
      apt-get install -y ffmpeg
      npm install
      npm run postinstall
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FFMPEG_PATH
        sync: false
      - key: FFPROBE_PATH
        sync: false
